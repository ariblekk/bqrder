# Example stack (Postgres + API + web behind nginx). Copy this file to
# `docker-compose.yml` and copy `.env.example` to `.env`, then fill strong
# values. The real `docker-compose.yml` and `.env` are gitignored so only this
# example lives in the repo — never commit secrets.
#
#   cp docker-compose-example.yml docker-compose.yml
#   cp .env.example .env
#   docker compose up -d --build
services:
  postgres:
    image: postgres:16-alpine
    container_name: qrdigo-db
    environment:
      POSTGRES_USER: ${DB_USER:-qrdigo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:-qrdigo}
    volumes:
      - qrdigo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-qrdigo} -d ${DB_NAME:-qrdigo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    image: ariblekk/qrdigo:local
    build:
      context: .
      args:
        VITE_API_URL: /api/v1
    container_name: qrdigo
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_SSLMODE: disable
      UPLOAD_PATH: /app/uploads
      TRUSTED_PROXIES: 127.0.0.1/8
    ports:
      - "2301:80"
    volumes:
      - qrdigo_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:8080/api/v1/health || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  qrdigo_pgdata:
  qrdigo_uploads:
